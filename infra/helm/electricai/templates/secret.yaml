apiVersion: v1
kind: Secret
metadata:
  name: {{ include "electricai.fullname" . | default "electricai-api" }}-secret
  labels:
    app.kubernetes.io/name: electricai
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.password | default "electric_secure_prod" | quote }}
  ANTHROPIC_API_KEY: {{ .Values.env.ANTHROPIC_API_KEY | default "" | quote }}
  OPENAI_API_KEY: {{ .Values.env.OPENAI_API_KEY | default "" | quote }}
  GEMINI_API_KEY: {{ .Values.env.GEMINI_API_KEY | default "" | quote }}
